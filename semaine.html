<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Une semaine du carnet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#EDE3CC; --ink:#1B2A4A; --ink-soft:#334463; --sage:#6E8B7A; --stamp:#B24C3A; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:
      radial-gradient(circle at 15% 20%, rgba(0,0,0,0.025), transparent 55%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.012) 0px, transparent 1px, transparent 3px),
      var(--paper);
    color:var(--ink-soft); font-family:'Source Serif 4', serif; line-height:1.6;
  }
  .page{ max-width:600px; margin:0 auto; padding:2.2rem 1.3rem 4rem; }
  a.back{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; color:var(--ink); text-decoration:none; display:inline-block; margin-bottom:1.5rem; }
  a.back:before{ content:"← "; }
  h1{ font-family:'Caveat', cursive; font-size:2.4rem; color:var(--ink); font-weight:700; }
  .teaser{ font-style:italic; opacity:0.75; margin:0.4rem 0 1.6rem; }
  .content{ border:1.5px solid rgba(27,42,74,0.2); background:rgba(255,255,255,0.32); border-radius:18px 8px 20px 10px; padding:1.4rem 1.2rem; }
  .content p{ margin-bottom:0.9rem; }
  .content audio, .content video, .content img{ width:100%; border-radius:8px; margin-top:0.4rem; }
  .content iframe{ width:100%; height:300px; border:none; border-radius:8px; margin-top:0.4rem; }
  #notfound{ font-family:'Caveat', cursive; font-size:1.6rem; color:var(--ink); }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="index.html">retour au carnet</a>
  <div id="week"></div>
</div>
<script src="entries.js?v=1"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'), 10);
  const entry = ENTRIES.find(e => e.id === id);
  const now = new Date();
  const wrap = document.getElementById('week');

  function renderContent(entry){
    switch(entry.type){
      case 'text': return entry.content.split('\n\n').map(p => `<p>${p}</p>`).join('');
      case 'audio': return `<audio controls src="${entry.content}"></audio>`;
      case 'video': return `<video controls src="${entry.content}"></video>`;
      case 'image': return `<img src="${entry.content}" alt="${entry.title}">`;
      case 'embed': return `<iframe src="${entry.content}"></iframe>`;
      default: return '';
    }
  }

  if(!entry){
    wrap.innerHTML = `<div id="notfound">Cette page n'existe pas (encore).</div>`;
  } else if(now < new Date(entry.unlock + 'T00:00:00')){
    wrap.innerHTML = `<div id="notfound">Pas encore — reviens le ${new Date(entry.unlock).toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}.</div>`;
  } else {
    wrap.innerHTML = `
      <h1>${entry.title}</h1>
      <div class="teaser">${entry.teaser}</div>
      <div class="content">${renderContent(entry)}</div>
    `;
    const CONFETTI = ['✨','🌸','💥','🎉','⭐','💫','🌊','💛'];
    const cx = window.innerWidth/2, cy = window.innerHeight*0.28;
    for(let i=0;i<32;i++){
      const s = document.createElement('span');
      s.textContent = CONFETTI[Math.floor(Math.random()*CONFETTI.length)];
      const angle = Math.random()*Math.PI*2;
      const dist = 100 + Math.random()*220;
      const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
      s.style.cssText = `position:fixed; left:${cx}px; top:${cy}px; font-size:${1+Math.random()*1.6}rem;
        pointer-events:none; z-index:300; opacity:1;
        transition:transform ${0.7+Math.random()*0.5}s cubic-bezier(.2,.8,.3,1), opacity 1.1s ease;`;
      document.body.appendChild(s);
      requestAnimationFrame(() => {
        s.style.transform = `translate(${dx}px, ${dy}px) rotate(${(Math.random()*360)|0}deg)`;
        s.style.opacity = '0';
      });
      setTimeout(() => s.remove(), 1400);
    }
  }
</script>
</body>
</html>
